"What is the Copy-on-Write mechanism?":"Copy-on-Write (COW): when a process forks, parent and child initially share same memory pages. When either modifies a page, OS creates a private copy of that page only. Benefit: fast fork, saves memory.",
"Explain the difference between mutex and semaphore.":"Mutex: binary lock with ownership - only the thread that locked it can unlock it, used to protect critical sections. Semaphore: counting, no ownership - any thread can signal/wait, used for resource counting.",
"What is a hypervisor and what types exist?":"Hypervisor creates and manages virtual machines. Type 1 (Bare-metal): runs directly on hardware without host OS - better performance, used in data centers. Examples: VMware ESXi, Hyper-V. Type 2 (Hosted): runs on top of host OS. Examples: VirtualBox.",
"What is an operating system?":"An operating system is system software managing computer hardware and software resources. Core functions: process management, memory management, file system, device management, user interface, security. Examples: Windows, Linux, macOS, Android.",
"What is Windows?":"Windows is Microsoft's series of operating systems - most widely used desktop OS worldwide. Uses NTFS file system, supports graphical user interface, multitasking. Current version: Windows 11. Manages users, files, applications, hardware.",
"What is a file?":"A file is a named collection of related data stored on a storage device. Can contain text, images, audio, video, or executable code. Each file has name, extension (.txt, .jpg, .exe), size, location, and metadata.",
"What is a folder?":"A folder (directory) is a container in the file system that organizes and stores files and other folders creating a tree hierarchy. Makes file management easier. Can be created, renamed, moved, copied, and deleted.",
"What is RAM?":"RAM (Random Access Memory) is volatile primary memory that temporarily stores data the CPU is actively working with. Much faster than HDD/SSD. More RAM allows more programs running simultaneously. Data lost when power off.",
"What is software engineering?":"Software engineering applies systematic engineering principles to software development. Covers entire lifecycle: requirements, design, coding, testing, deployment, maintenance. Emphasizes reliability, scalability, maintainability, project management, and team collaboration.",
"What is the software development life cycle (SDLC)?":"SDLC is a structured process: 1. Planning. 2. Requirements Analysis. 3. System Design. 4. Implementation (coding). 5. Testing. 6. Deployment. 7. Maintenance.",
"What is the difference between waterfall and agile methodology?":"Waterfall: linear, sequential - each phase fully complete before next begins, rigid requirements. Agile: iterative - short sprints (2-4 weeks) delivering working software, embraces changing requirements.",
"What is a requirement in software engineering?":"Requirements specify what a system must do. Functional: specific behaviors - 'user can reset password'. Non-functional: quality attributes - performance, security, scalability. Poorly defined requirements are the number one cause of project failure.",
"What is a use case diagram?":"Use case diagram (UML) shows interactions between actors and system functionalities. Shows WHAT the system does from user perspective. Elements: actors (stick figures), use cases (ovals), system boundary (rectangle).",
"What is version control and why is it important?":"Version control tracks all changes to source code over time. Git is the standard distributed VCS. Importance: team collaboration, complete history of every change, feature branching, rollback when bugs are introduced.",
"What is the difference between black box and white box testing?":"Black box testing: tester has no knowledge of internal code - tests based on requirements and expected input/output. White box testing: tester knows internal code structure - tests based on logic, code paths, branches.",
"What is a bug and what is a feature?":"A bug is an unintended error causing incorrect behavior or crashes. A feature is an intentional, designed functionality adding value to the software. Bug tracking tools: Jira, GitHub Issues.",
"What is documentation in software engineering?":"Documentation records software knowledge. Types: requirements documents, design documents, API docs, user manuals, code comments. Good documentation reduces onboarding time, aids maintenance, enables team collaboration.",
"What is a sprint in agile?":"Sprint is a fixed time-boxed iteration in Agile/Scrum, typically 1-4 weeks. Team selects tasks from product backlog. Sprint ceremonies: Planning, Daily Standup, Sprint Review (demo to stakeholders), Retrospective.",
"Explain the difference between functional and non-functional requirements.":"Functional requirements define what the system should DO - specific behaviors. Non-functional define how well the system performs - quality attributes: Performance, Security, Scalability, Availability.",
"What is a design pattern? Explain MVC pattern.":"Design pattern is a proven reusable solution to a common design problem. MVC (Model-View-Controller) separates concerns: Model (data and business logic), View (user interface), Controller (handles user input). Used in Django, Rails, Spring MVC.",
"What is unit testing and integration testing?":"Unit testing: tests individual functions or components in isolation - fast, easy to pinpoint bugs. Integration testing: tests how multiple components work together - ensures they communicate correctly.",
"What is continuous integration and continuous deployment (CI/CD)?":"CI: developers frequently merge code - automated builds and tests run on every commit. CD: automatically deploys every passing build to production. Benefits: faster releases, reduced risk. Tools: Jenkins, GitHub Actions.",
"What is the difference between verification and validation?":"Verification: are we building the system RIGHT? Checks system matches specifications. Validation: are we building the RIGHT system? Checks system meets actual user needs.",
"Explain the concept of technical debt.":"Technical debt: shortcuts made to deliver faster - create future maintenance burden. Examples: skipping documentation, duplicating code. Accumulates over time making changes slower and riskier.",
"What is refactoring and why is it important?":"Refactoring: restructuring existing code without changing its external behavior - improves internal structure, readability, and maintainability. Requires comprehensive test suite to ensure behavior is unchanged.",
"What is a UML diagram? Name four types.":"UML (Unified Modeling Language) provides standard notation for software design. Four types: Class Diagram, Use Case Diagram (actors and system functions), Sequence Diagram (time-ordered interactions), Activity Diagram (workflow flowchart).",
"What is code review and what are its benefits?":"Code review: systematic examination of source code by other developers before merging. Benefits: catches bugs early, shares knowledge, enforces coding standards, improves code quality, mentors junior developers.",
"What is software coupling and cohesion?":"Coupling: how dependent modules are on each other - low coupling is desirable. Cohesion: how focused a module is on one purpose - high cohesion is desirable. Goal: low coupling + high cohesion = maintainable, modular, testable code.",
"Explain SOLID principles with examples.":"S - Single Responsibility: class has one reason to change. O - Open/Closed: open for extension, closed for modification. L - Liskov Substitution: subclasses work wherever parent is expected. I - Interface Segregation: prefer small interfaces. D - Dependency Inversion: depend on abstractions.",
"What is domain-driven design (DDD)?":"DDD is a software design approach focusing on modeling software to match real-world domain. Key concepts: Ubiquitous Language (shared vocabulary), Bounded Context (clear domain boundaries), Aggregates, Domain Events, Repositories.",
"What is the difference between microservices and SOA?":"SOA: coarse-grained services communicating via enterprise service bus, shared databases common. Microservices: fine-grained independently deployable services communicating via lightweight APIs, each has own database.",
"Explain test-driven development (TDD) and its benefits.":"TDD: write failing test FIRST, then write minimum code to pass test, then refactor. Red-Green-Refactor cycle. Benefits: code has test coverage by design, catches regressions immediately, design naturally becomes testable.",
"What is DevOps and how does it bridge development and operations?":"DevOps combines development and operations for faster, more reliable software delivery. Key practices: CI/CD pipelines, infrastructure as code, automated testing, monitoring (Prometheus, Grafana), shared responsibility for production.",
"Explain the concept of fault tolerance in software systems.":"Fault tolerance: system continues operating correctly when components fail. Techniques: Redundancy (multiple instances), Replication, Circuit Breaker pattern, Retry with exponential backoff, Graceful degradation.",
"What is software entropy and how do you manage it?":"Software entropy: tendency of software systems to become more complex, harder to maintain over time. Managed by: regular refactoring, enforcing coding standards, removing dead code, updating dependencies, writing tests.",
"Explain the event sourcing pattern.":"Event sourcing: store all changes to application state as a sequence of events rather than just current state. Current state = replay of all events. Benefits: complete audit trail, can rebuild state at any point in time. Used with CQRS pattern.",
"What is Conway's Law and how does it affect software architecture?":"Conway's Law: organizations design systems that mirror their communication structure. Teams create software with same boundaries as their team boundaries. Inverse Conway Maneuver: structure teams to encourage desired architecture.",
"What is chaos engineering?":"Chaos engineering: intentionally injecting failures into production systems to test resilience and identify weaknesses. Practices: randomly kill instances, introduce network latency. Netflix Chaos Monkey is a famous example.",
"What is software?":"Software is a collection of programs, instructions, and data telling a computer how to perform tasks. Types: system software (OS), application software (Word, Chrome), programming software (compilers, IDEs).",
"What is an app?":"An app (application) is software designed for a specific purpose for end users. Types: mobile apps (iOS/Android), web apps (browser-based), desktop apps (installed on computer). Built using programming languages and frameworks.",
"What is a developer?":"Software developer designs, codes, tests, and maintains software. Types: frontend (HTML, CSS, JavaScript), backend (server-side logic, databases, APIs), full-stack (both), mobile developer (iOS/Android). Work in teams using Agile methodology.",
"What is a bug?":"A bug is an error, flaw, or unintended behavior in a program causing incorrect results or crashes. Types: syntax errors, logic errors, runtime errors. Finding and fixing bugs is called debugging.",
"What is testing?":"Software testing verifies a program works correctly and meets requirements. Types: Unit, Integration, System, User Acceptance Testing. Manual vs automated testing. Testing finds bugs before release and ensures quality.",
"What is HTML and what is it used for?":"HTML (HyperText Markup Language) structures web page content using elements and tags: h1-h6 (headings), p (paragraph), div (container), a (link), img (image). HTML5 added semantic tags (header, footer, nav, article).",
"What is CSS and how does it style a webpage?":"CSS (Cascading Style Sheets) controls visual presentation of HTML. Selects elements and applies properties: color, font-size, padding, margin, display, flexbox, grid, animation. Three ways: inline, internal, external (.css file).",
"What is JavaScript and what does it do on a webpage?":"JavaScript makes websites dynamic and interactive. Can manipulate DOM (change HTML/CSS), respond to user events, validate forms, make async HTTP requests. Only language natively supported by all browsers. Also runs server-side via Node.js.",
"What is the difference between frontend and backend?":"Frontend: HTML, CSS, JavaScript - runs in user's browser, handles user interface. Backend: server-side (Node.js, Python, PHP, Java) - handles business logic, authentication, database operations, APIs. They communicate via HTTP.",
"What is a web server?":"Web server software receives HTTP requests from browsers and responds with web pages or data. Serves HTML, CSS, JavaScript, images and static files. Popular: Apache, Nginx. Node.js/Express creates custom servers.",
"What is a URL?":"URL (Uniform Resource Locator) is the complete address of a resource. Structure: protocol://subdomain.domain.tld:port/path?query=value#fragment. Example: https://www.example.com/products?id=5#reviews.",
"What is the difference between GET and POST requests?":"GET: retrieve data, parameters in URL - visible, bookmarkable, cacheable, limited length, should not modify server state. POST: send data in request body - not visible in URL, no length limit, used for forms, login, creating data.",
"What is responsive design?":"Responsive design makes websites adapt to different screen sizes. Techniques: CSS media queries (@media breakpoints), flexible grid layouts (CSS Grid, Flexbox), fluid images (max-width:100%), viewport meta tag.",
"What is a cookie and what is local storage?":"Cookie: small data in browser, sent with every HTTP request to server, max 4KB, has expiration, used for sessions. Local Storage: client-side only, NOT sent to server, about 5MB capacity, persists after browser close.",
"What is a DOM?":"DOM (Document Object Model) is a tree-like interface representing HTML as objects. Each HTML element is a node. JavaScript manipulates DOM to dynamically change content, style, structure without page reload.",
"Explain the difference between REST and GraphQL APIs.":"REST: multiple endpoints returning predefined data structures - can over-fetch or under-fetch. Simple, widely used. GraphQL: single endpoint - client specifies exact data needed. No over/under-fetching. Better for complex or nested data.",
"What is AJAX and how does it work?":"AJAX updates web page content without full page reload. JavaScript sends HTTP request in background via Fetch API. Server responds with JSON data. JavaScript receives response and updates specific DOM elements.",
"What is the difference between synchronous and asynchronous JavaScript?":"Synchronous: executes line by line, blocking. Asynchronous: non-blocking - code continues while waiting for long operations. Mechanisms: callbacks (older), Promises (.then/.catch), async/await (cleaner syntax).",
"What is a React component? Explain props and state.":"React component is a reusable UI piece - JavaScript function returning JSX. Props: data passed from parent to child component - read-only. State: internal component data managed by useState hook - mutable, when changed React re-renders.",
"What is the difference between SQL and NoSQL databases in web apps?":"SQL (MySQL, PostgreSQL): relational tables, ACID transactions, strong consistency. NoSQL (MongoDB, Firebase): flexible documents, horizontal scaling. Web apps often use both: SQL for transactions, NoSQL for caching.",
"What is session management and authentication?":"Authentication verifies who the user is (login). Session management maintains user identity across requests since HTTP is stateless. Methods: Session cookies (server stores session data), JWT tokens (client stores signed token).",
"What is CORS and why does it exist?":"CORS (Cross-Origin Resource Sharing) is a browser security mechanism blocking requests from one origin to a different origin. Protects users from malicious sites making unauthorized requests. Server enables CORS by setting Access-Control-Allow-Origin headers.",
"Explain the box model in CSS.":"CSS box model: Content (actual text/image), Padding (space between content and border), Border (surrounds padding), Margin (space outside border). box-sizing:border-box is preferred - includes padding and border in specified width.",
"What is webpack and why is it used?":"Webpack is a module bundler for JavaScript applications. Takes many source files, resolves dependencies, bundles into optimized files. Features: code splitting, tree-shaking, minification, transpilation via Babel.",
"What is the difference between server-side rendering and client-side rendering?":"CSR: browser downloads minimal HTML + large JS bundle - JavaScript renders content. Faster navigation, poor initial load and SEO. SSR: server renders complete HTML per request - fast initial load, better SEO. Example: Next.js.",
"What is OAuth 2.0 and how does it work?":"OAuth 2.0 lets users grant third-party apps access to their resources without sharing passwords. Flow: user clicks 'Login with Google', redirected to Google, grants permission, Google sends authorization code, app exchanges code for access token.",
"Explain the event loop in JavaScript and how it handles async operations.":"JavaScript is single-threaded. Event loop enables async: Call stack executes synchronous code. Web APIs handle async operations in background. When async operation completes, callback placed in task queue. Event loop moves tasks to stack when it's empty.",
"What is WebSocket and when should you use it over HTTP?":"WebSocket provides persistent, full-duplex bidirectional communication over single TCP connection. Unlike HTTP (request-response), server can push data to client anytime. Use for: chat apps, live notifications, online gaming, collaborative editing.",
"Explain the concept of progressive web apps (PWAs).":"PWA delivers app-like experiences using modern web APIs. Key features: Service Worker (enables offline functionality, push notifications), Web App Manifest (allows Add to Home Screen), HTTPS required. Benefits: works offline, installable without app store.",
"What is service worker and how does it enable offline functionality?":"Service worker is a JavaScript file that runs in background. Acts as network proxy: intercepts HTTP requests and can serve cached responses when offline. Cache strategies: Cache-First, Network-First. Enables PWA offline functionality.",
"Explain the critical rendering path in browsers.":"Critical rendering path: Parse HTML -> build DOM. Parse CSS -> build CSSOM. Combine -> Render Tree. Layout (calculate positions). Paint (draw pixels). Optimize by: minimizing render-blocking resources, deferring non-critical CSS/JS.",
"What is Content Security Policy (CSP) and why is it important?":"CSP is an HTTP header telling browsers which content sources are trusted. Prevents XSS attacks by blocking inline scripts and restricting script sources. Example: Content-Security-Policy: script-src 'self' trusted.cdn.com.",
"Explain the virtual DOM and how React uses it for performance.":"Virtual DOM (VDOM): lightweight JavaScript copy of actual DOM. When state changes, React creates new VDOM tree, compares with previous (diffing), finds minimal changes needed, then batches updates to real DOM to minimize expensive operations.",
"What is GraphQL subscriptions and when are they useful?":"GraphQL subscriptions enable real-time data. Client subscribes to specific events; server pushes updates when data changes. Uses WebSockets under the hood. Useful for: live notifications, real-time dashboards, collaborative features.",
"What is micro-frontend architecture?":"Micro-frontend: apply microservices concept to frontend - split large frontend app into smaller, independently deployable pieces. Each micro-frontend built with own tech stack, deployed independently. Benefits: team autonomy, independent deployment.",
"What is a browser?":"A web browser is an application for accessing and displaying websites. Sends HTTP requests to web servers, receives HTML/CSS/JavaScript, and renders it visually. Has rendering engine (Chrome: Blink), JavaScript engine (Chrome: V8). Popular: Chrome, Firefox, Edge, Safari.",
"What is cyber security?":"Cyber security protects computer systems, networks, software, and data from digital attacks, unauthorized access, damage, and theft. Domains: network security, application security, information security. Core goal: maintain CIA triad (Confidentiality, Integrity, Availability).",
"What is the difference between authentication and authorization?":"Authentication verifies identity - who are you? Methods: passwords, biometrics, OTP. Authorization determines permissions - what can you do? Happens after authentication. Example: login (authentication) then accessing specific folders based on role (authorization).",
"What is a password and what makes it strong?":"A strong password is 12+ characters long, includes uppercase, lowercase, numbers, and special symbols. Avoid: common words, birthdays, sequential patterns. Use unique password per account. Password managers generate and store complex passwords. Enable 2FA.",
"What is malware?":"Malware (malicious software) is any software designed to harm systems. Types: Virus (attaches to files, spreads), Worm (self-replicates across networks), Trojan (disguised as legitimate software), Ransomware (encrypts files, demands ransom), Spyware. Prevention: antivirus, keep OS updated.",
"What is phishing?":"Phishing is a social engineering attack impersonating trusted entities via fake emails/websites to steal credentials. Warning signs: urgency, suspicious sender address, grammar errors, requests for sensitive info. Prevention: verify sender, enable 2FA.",
"What is encryption?":"Encryption converts readable plaintext into unreadable ciphertext using algorithm and key. Symmetric (AES): same key for encrypt/decrypt - fast, good for large data. Asymmetric (RSA): public key encrypts, private key decrypts. HTTPS uses both.",
"What is two-factor authentication?":"2FA adds second verification layer beyond password. Factor types: something you know (password), something you have (phone OTP, YubiKey), something you are (fingerprint, face). Even if password is stolen, attacker needs second factor.",
"What is a virus vs a worm?":"Virus: attaches to legitimate files, requires human action to spread, damages data. Worm: self-replicating malware that spreads across networks automatically without human interaction - exploits network vulnerabilities. Worms spread faster and don't need a host file.",
"What is a VPN?":"VPN (Virtual Private Network) creates an encrypted tunnel between your device and a VPN server. Benefits: encrypts data on public Wi-Fi, hides real IP address, enables secure remote corporate access. Protocols: OpenVPN, WireGuard, IPSec.",
"What is the difference between symmetric and asymmetric encryption?":"Symmetric encryption: single secret key for both encryption and decryption - fast, efficient for large data but key distribution is a problem. Examples: AES-256. Asymmetric: public key encrypts, private key decrypts. Examples: RSA. HTTPS uses asymmetric to exchange symmetric session keys.",
"What is a SQL injection attack? How do you prevent it?":"SQL injection: attacker inserts malicious SQL into input fields to manipulate database queries. Example: entering ' OR '1'='1 in login form bypasses authentication. Prevention: parameterized queries/prepared statements (most effective), input validation, ORM frameworks.",
"What is cross-site scripting (XSS)?":"XSS: attacker injects malicious JavaScript into web pages viewed by other users. Types: Stored XSS (script saved in database), Reflected XSS (script in URL parameter). Consequences: steal cookies/sessions, redirect users. Prevention: encode output, Content Security Policy (CSP).",
"What is a man-in-the-middle attack?":"MITM: attacker secretly intercepts communication between two parties. Techniques: ARP poisoning, rogue Wi-Fi hotspot, DNS spoofing. Can steal credentials. Prevention: HTTPS with certificate verification, HSTS, certificate pinning, VPN on public Wi-Fi.",
"What is a denial of service (DoS) attack?":"DoS floods target server with traffic to exhaust resources, making service unavailable. DDoS (Distributed): attack from thousands of compromised devices (botnet). Mitigation: rate limiting, traffic scrubbing, CDN, WAF, BGP blackholing.",
"What is public key infrastructure (PKI)?":"PKI is a framework managing digital certificates and public-key encryption. Certificate Authority (CA) issues certificates. Digital certificates bind public key to identity. When you visit HTTPS site, browser verifies certificate was issued by trusted CA.",
"What is the CIA triad in cyber security?":"CIA Triad: Confidentiality - information accessible only to authorized parties (encryption, access controls). Integrity - data is accurate and untampered (checksums, hashing). Availability - systems and data accessible when needed (backups, redundancy, DDoS protection).",
"What is penetration testing?":"Penetration testing (ethical hacking) simulates cyberattacks with permission to find vulnerabilities. Phases: reconnaissance, scanning (find open ports), exploitation, post-exploitation, reporting. Types: black box (no info), white box (full info). Certifications: CEH, OSCP.",
"What is a zero-day vulnerability?":"Zero-day vulnerability is a software flaw unknown to the vendor - no patch exists yet. Called 'zero-day' because vendor has had zero days to fix it. Extremely dangerous - can be exploited with no defense available.",
"What is social engineering in cyber security?":"Social engineering manipulates people psychologically to reveal confidential info. Examples: phishing (fake emails), vishing (phone calls impersonating IT support), pretexting (fabricated scenarios), baiting (malicious USB drives). Prevention: security awareness training.",
"Explain the RSA encryption algorithm.":"RSA uses difficulty of factoring large numbers. Key generation: choose two large primes p and q, compute n = p*q, compute Euler totient phi(n), choose public exponent e, compute private exponent d such that e*d = 1 mod phi(n). Encrypt: C = M^e mod n. Decrypt: M = C^d mod n.",
"What is a buffer overflow attack and how is it exploited?":"Buffer overflow: program writes more data to a buffer than it can hold, overwriting adjacent memory. Attacker overwrites return address to redirect execution to malicious shellcode. Prevention: bounds checking, stack canaries, ASLR, NX (non-executable memory pages).",
"Explain the concept of defense in depth.":"Defense in depth applies multiple layers of security so if one fails, others still protect. Layers: Physical security, Perimeter (firewall, IDS/IPS), Network (segmentation), Endpoint (antivirus), Application (secure coding, WAF), Data (encryption at rest), User (authentication, training).",
"What is a rainbow table attack and how does salting prevent it?":"Rainbow table: precomputed lookup table mapping password hashes to original passwords - attacker can instantly crack matching hashes. Salting: add unique random string to each password before hashing - same password produces different hash for each user. Rainbow tables become useless.",
"Explain the OWASP Top 10 vulnerabilities.":"OWASP Top 10 most critical web security risks: 1) Injection. 2) Broken Authentication. 3) Sensitive Data Exposure. 4) XML External Entities (XXE). 5) Broken Access Control. 6) Security Misconfiguration. 7) XSS. 8) Insecure Deserialization. 9) Vulnerable Components. 10) Insufficient Logging/Monitoring.",
"What is a side-channel attack?":"Side-channel attack extracts secret information by analyzing physical implementation of a system. Examples: Timing attacks (measure how long operations take), Power analysis (measure power consumption), Cache-timing attacks (Spectre, Meltdown). Exploits implementation not algorithm.",
"Explain the difference between IDS and IPS systems.":"IDS (Intrusion Detection System): monitors network traffic and alerts when suspicious activity detected - passive, only detects. IPS (Intrusion Prevention System): monitors and actively blocks malicious traffic in real-time. IDS for detection and forensics; IPS for active prevention.",
"What is steganography?":"Steganography hides secret information within ordinary files to avoid detection. Examples: hiding text in image pixels (LSB steganography), hiding data in audio files. Unlike encryption which makes data unreadable, steganography hides its very existence.",
"Explain the concept of threat modeling.":"Threat modeling identifies and prioritizes potential security threats. Process: 1) Define security objectives. 2) Create data flow diagram. 3) Identify threats using STRIDE (Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation of privilege). 4) Prioritize risks. 5) Plan mitigations.",
"What is the difference between black hat, white hat, and grey hat hackers?":"White hat hackers: ethical security professionals who hack systems WITH explicit permission - penetration testers. Help organizations improve security. Certifications: CEH, OSCP. Black hat: malicious criminals who hack WITHOUT permission - illegal. Grey hat: find vulnerabilities without permission but report them.",
"What is a hacker?":"A hacker is someone who uses technical skills to access or manipulate computer systems. White hat (ethical): authorized security testing. Black hat (malicious): unauthorized access for criminal purposes. Grey hat: unauthorized access but typically reports findings.",
"What is data privacy?":"Data privacy is individuals' right to control how their personal information is collected, used, and shared. Laws: GDPR (Europe - strict, heavy fines), CCPA (California). Best practices: read privacy policies, minimize data you share, adjust app permissions.",
"What is safe browsing?":"Safe browsing practices: use HTTPS websites (padlock icon), don't click suspicious links, download only from trusted sources, use strong unique passwords with 2FA, keep browser and OS updated with security patches, be cautious on public Wi-Fi (use VPN).",
"What is virus in computer?":"A computer virus is malicious code that attaches to programs or files and spreads when infected files are shared. Effects: corrupt or delete files, steal information, slow system, give attackers remote access. Prevention: install reputable antivirus software, keep OS updated, avoid suspicious downloads."
};

// ─── AI fallback for missing answers ────────────────────────────────────────
const aiCache = {};

async function getModelAnswer(question) {
  if (MA[question]) return MA[question];
  if (aiCache[question]) return aiCache[question];

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 200,
        messages: [{
          role: "user",
          content: `You are a CS/IT professor. Give a clear, concise model answer (3-5 sentences) for this viva question: "${question}". Only provide the answer, no preamble.`
        }]
      })
    });
    const data = await res.json();
    const answer = data.content?.[0]?.text || "Please review this topic in your textbook for a complete answer.";
    aiCache[question] = answer;
    return answer;
  } catch(e) {
    return "Please review this topic in your textbook for a complete answer.";
  }
}

// ─── RENDER RESULT ───────────────────────────────────────────────────────────
async function renderResult(data) {
  const { subject, diff, examiner, score, totalScore, percentage, violations, answers, date } = data;
  const exNames = { strict: 'Strict Professor', friendly: 'Friendly Mentor', industry: 'Industry Expert' };
  const d = new Date(date).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  const pctColor = percentage >= 70 ? '#00ff94' : percentage >= 50 ? '#ffd166' : '#ff3d71';
  const grade = percentage >= 80 ? 'Excellent 🏆' : percentage >= 60 ? 'Good 👍' : percentage >= 40 ? 'Average 📚' : 'Needs Work 💪';
  const gradeColor = percentage >= 80 ? '#00ff94' : percentage >= 60 ? '#ffd166' : percentage >= 40 ? '#00e5ff' : '#ff3d71';
  const pct = `${percentage}%`;

  document.getElementById('main').innerHTML = `
    <div class="score-header" style="--clr:${pctColor};--pct:${pct}">
      <h2>Viva Complete!</h2>
      <div class="score-meta">${subject} &bull; ${(diff||'medium').toUpperCase()} &bull; ${exNames[examiner||'strict']} &bull; ${d}</div>
      <div class="score-circle" style="--clr:${pctColor};--pct:${pct}">
        <div class="score-pct" style="color:${pctColor}">${percentage}%</div>
        <div class="score-lbl">Score</div>
      </div>
      <div class="grade-badge" style="background:${gradeColor}22;color:${gradeColor};border:1px solid ${gradeColor}44">${grade}</div>
      <div class="stats-row">
        <div class="stat-box"><span class="stat-val" style="color:#00e5ff">${score}/${totalScore}</span><span class="stat-key">Total Marks</span></div>
        <div class="stat-box"><span class="stat-val" style="color:#00ff94">${answers.filter(a=>a.score>=8).length}</span><span class="stat-key">Excellent</span></div>
        <div class="stat-box"><span class="stat-val" style="color:#ffd166">${answers.filter(a=>a.score>=5&&a.score<8).length}</span><span class="stat-key">Average</span></div>
        <div class="stat-box"><span class="stat-val" style="color:#ff3d71">${answers.filter(a=>a.score<5).length}</span><span class="stat-key">Poor</span></div>
      </div>
    </div>
    ${violations&&violations.length?`<div class="violations-card"><h3>⚠ Anti-Cheat Violations (${violations.length})</h3>${violations.map(v=>`<div class="violation-item">${v}</div>`).join('')}</div>`:''}
    <div class="section-title">Question by Question Review</div>
    <div id="q-list">
      ${answers.map((a,i)=>{
        const skip = a.answer&&a.answer.includes('SKIPPED');
        const cls = skip?'skipped':a.score>=8?'excellent':a.score>=5?'good':'poor';
        const badge = skip?'SKIPPED':a.score+'/10';
        return `<div class="q-card ${cls}" id="qc-${i}">
          <div class="q-card-header"><div class="q-num">Question ${i+1} of ${answers.length}</div><div class="q-score-badge ${cls}">${badge}</div></div>
          <div class="q-question">${a.question}</div>
          <div class="q-lbl user">✏ Your Answer</div>
          <div class="q-box ${skip?'skip':''}">${skip?'This question was skipped due to a violation. 0 marks awarded.':(a.answer||'(No answer provided)')}</div>
          <div class="q-lbl ai">✨ Model Answer</div>
          <div class="q-box ai loading" id="ma-${i}">
            <div class="dots"><span></span><span></span><span></span></div> Loading...
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="action-row">
      <button class="btn-dl" onclick="downloadReport()">⬇ Download Report</button>
      <button class="btn-hist" onclick="window.location.href='history.html'">📋 View History</button>
      <button class="btn-new" onclick="window.location.href='viva.html'">🎤 New Viva</button>
    </div>`;

  // Load model answers in background
  for (let i = 0; i < answers.length; i++) {
    const a = answers[i];
    const skip = a.answer && a.answer.includes('SKIPPED');
    const el = document.getElementById(`ma-${i}`);
    if (!el) continue;
    if (skip) {
      el.className = 'q-box ai skip';
      el.textContent = 'Question was skipped. No model answer available.';
      continue;
    }
    const ans = await getModelAnswer(a.question);
    el.className = 'q-box ai';
    el.textContent = ans;
  }
}

// ─── DOWNLOAD REPORT ─────────────────────────────────────────────────────────
window.downloadReport = function() {
  const raw = sessionStorage.getItem('vivaResult');
  if (!raw) return;
  const d = JSON.parse(raw);
  const exN = { strict:'Strict Professor', friendly:'Friendly Mentor', industry:'Industry Expert' };
  const grade = d.percentage>=80?'Excellent':d.percentage>=60?'Good':d.percentage>=40?'Average':'Needs Work';
  let r = `VIVAIQ PERFORMANCE REPORT\nGenerated: ${new Date(d.date).toLocaleDateString()}\n${'='.repeat(50)}\nSubject: ${d.subject}\nDifficulty: ${(d.diff||'medium').toUpperCase()}\nExaminer: ${exN[d.examiner||'strict']}\n\nOVERALL SCORE: ${d.score}/${d.totalScore} (${d.percentage}%)\nGrade: ${grade}\nViolations: ${d.violations?d.violations.length:0}\n\n`;
  if (d.violations&&d.violations.length) { r+=`VIOLATIONS\n${'-'.repeat(30)}\n`; d.violations.forEach(v=>r+=v+'\n'); r+='\n'; }
  r += `QUESTION BY QUESTION REVIEW\n${'='.repeat(50)}\n`;
  d.answers.forEach((a,i) => {
    const mAns = MA[a.question] || aiCache[a.question] || 'Please review this topic in your textbook.';
    r += `\nQ${i+1} [Score: ${a.score}/10]\nQuestion: ${a.question}\n\nYour Answer:\n${a.answer||'(No answer)'}\n\nModel Answer:\n${mAns}\n\n${'-'.repeat(50)}\n`;
  });
  const blob = new Blob([r], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href=url; link.download=`VivaIQ_Report_${(d.subject||'').replace(/\s/g,'_')}_${Date.now()}.txt`; link.click();
  URL.revokeObjectURL(url);
};

// ─── LOAD IMMEDIATELY (NO auth wait) ─────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  const raw = sessionStorage.getItem('vivaResult');
  if (!raw) {
    document.getElementById('main').innerHTML = '<div class="err"><h3>No result found!</h3><p>Please complete a viva first.</p><button onclick="window.location.href=\'viva.html\'">Start Viva</button></div>';
    return;
  }
  try { renderResult(JSON.parse(raw)); }
  catch(e) { document.getElementById('main').innerHTML = '<div class="err"><h3>Error loading result</h3><button onclick="window.location.href=\'viva.html\'">Go Back</button></div>'; }
});
</script>
